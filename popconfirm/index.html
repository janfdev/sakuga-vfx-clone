<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakuga Popconfirm</title>
<style>
  :root { --page: #ffffff; --text: #1d1a4a; --mute: #8580b0; }
  html { overflow-x: clip; background: var(--page); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--text); font: 15px/1.45 -apple-system, "Helvetica Neue", "Segoe UI", sans-serif; overflow-x: clip; }
  main { width: min(640px, 100vw - 32px); padding: 40px 0 60px; text-align: center; }
  h1 { margin: 0; font: italic 800 26px/1.1 "Avenir Next", "Nunito", -apple-system, "Segoe UI", sans-serif; }
  .sub { margin: 4px 0 0; color: var(--mute); }
  .stage { display: flex; align-items: center; justify-content: center; min-height: 280px; padding: 40px 0; }
  .btn { padding: 12px 24px; border: 3px solid var(--text); border-radius: 12px; background: #fff; font: italic 800 16px/1 "Avenir Next", sans-serif; box-shadow: 4px 5px 0 #b8b3ff; cursor: pointer; }
  .btn:hover { background: #f4f3fc; }
  .hint, .said { margin: 0 4px; color: var(--mute); } .said { min-height: 1.45em; margin-top: 8px; font-size: 13px; }
  .embed body { place-items: start center; min-height: 0; } .embed h1, .embed .sub, .embed .hint { display: none; } .embed main { padding: 0; }
</style>
</head>
<body>
<main>
  <h1>Popconfirm</h1>
  <p class="sub">A speech bubble confirmation that clicks with カチッ.</p>
  <div class="stage">
    <sakuga-popconfirm id="el" title="Execute Maximum Overdrive?">
      <button type="button" class="btn">Deploy Super Move</button>
    </sakuga-popconfirm>
  </div>
  <p class="hint">Click the button to reveal the confirmation bubble.</p>
  <p class="said" aria-live="polite"></p>
</main>
<script src="popconfirm.js"></script>
<script>
const Q = new URLSearchParams(location.search), el = document.getElementById('el');
if (Q.get('embed') === '1') document.documentElement.classList.add('embed');
const say = (t) => { document.querySelector('.said').textContent = t; };
el.addEventListener('confirm', () => say('Confirmed: Move executed!'));
el.addEventListener('cancel', () => say('Cancelled'));
</script>
</body>
</html>
