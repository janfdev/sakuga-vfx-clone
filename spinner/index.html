<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakuga Spinner</title>
<style>
  :root { --page: #ffffff; --text: #1d1a4a; --mute: #8580b0; }
  html { overflow-x: clip; background: var(--page); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--text); font: 15px/1.45 -apple-system, "Helvetica Neue", "Segoe UI", sans-serif; overflow-x: clip; }
  main { width: min(640px, 100vw - 32px); padding: 40px 0 60px; text-align: center; }
  h1 { margin: 0; font: italic 800 26px/1.1 "Avenir Next", "Nunito", -apple-system, "Segoe UI", sans-serif; }
  .sub { margin: 4px 0 0; color: var(--mute); }
  .stage { display: flex; align-items: center; justify-content: center; gap: 36px; min-height: 280px; padding: 40px 0; }
  .btn { padding: 10px 20px; border: 2.5px solid var(--text); border-radius: 999px; background: #fff; font: 700 14px/1 sans-serif; cursor: pointer; }
  .hint, .said { margin: 0 4px; color: var(--mute); } .said { min-height: 1.45em; margin-top: 8px; font-size: 13px; }
  .embed body { place-items: start center; min-height: 0; } .embed h1, .embed .sub, .embed .hint { display: none; } .embed main { padding: 0; }
</style>
</head>
<body>
<main>
  <h1>Spinner</h1>
  <p class="sub">An anime ki aura vortex that spins and charges.</p>
  <div class="stage">
    <sakuga-spinner size="54"></sakuga-spinner>
    <sakuga-spinner id="spin-charge" size="64" charging label="Charging Power"></sakuga-spinner>
    <button type="button" class="btn" id="btn-done">Complete Load</button>
  </div>
  <p class="hint">Left is calm vortex; right is charging aura. Click Complete Load to trigger a finishing burst.</p>
  <p class="said" aria-live="polite"></p>
</main>
<script src="spinner.js"></script>
<script>
const Q = new URLSearchParams(location.search);
if (Q.get('embed') === '1') document.documentElement.classList.add('embed');
const say = (t) => { document.querySelector('.said').textContent = t; };
const spinner = document.getElementById('spin-charge');
document.getElementById('btn-done').addEventListener('click', () => {
  spinner.done();
  say('Load complete! Burst triggered.');
});
</script>
</body>
</html>
