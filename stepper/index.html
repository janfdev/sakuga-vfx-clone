<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakuga Stepper</title>
<style>
  :root { --page: #ffffff; --text: #1d1a4a; --mute: #8580b0; }
  html { overflow-x: clip; background: var(--page); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--text); font: 15px/1.45 -apple-system, "Helvetica Neue", "Segoe UI", sans-serif; overflow-x: clip; }
  main { width: min(640px, 100vw - 32px); padding: 40px 0 60px; }
  h1 { margin: 0; font: italic 800 26px/1.1 "Avenir Next", "Nunito", -apple-system, "Segoe UI", sans-serif; }
  .sub { margin: 4px 0 0; color: var(--mute); }
  .stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; min-height: 280px; padding: 40px 0; }
  .acts { display: flex; gap: 12px; }
  .btn { padding: 8px 18px; border: 2px solid var(--text); border-radius: 999px; background: none; font-weight: 700; cursor: pointer; }
  .hint, .said { margin: 0 4px; color: var(--mute); } .said { min-height: 1.45em; margin-top: 8px; font-size: 13px; }
  .embed body { place-items: start center; min-height: 0; } .embed h1, .embed .sub, .embed .hint { display: none; } .embed main { padding: 0; }
</style>
</head>
<body>
<main>
  <h1>Stepper</h1>
  <p class="sub">Step progress that charges lines and pops with ポン.</p>
  <div class="stage">
    <sakuga-stepper id="el" current="1" clickable>
      <option>Draft</option>
      <option>Review</option>
      <option>Approve</option>
      <option>Deploy</option>
    </sakuga-stepper>
    <div class="acts">
      <button type="button" class="btn" id="prev">Previous</button>
      <button type="button" class="btn" id="next">Next</button>
    </div>
  </div>
  <p class="hint">Click Next/Prev or click any step node directly.</p>
  <p class="said" aria-live="polite"></p>
</main>
<script src="stepper.js"></script>
<script>
const Q = new URLSearchParams(location.search), el = document.getElementById('el');
if (Q.get('embed') === '1') document.documentElement.classList.add('embed');
const say = (t) => { document.querySelector('.said').textContent = t; };
el.addEventListener('change', (e) => say(`Step: ${e.detail.current}`));
document.getElementById('next').addEventListener('click', () => el.next());
document.getElementById('prev').addEventListener('click', () => el.prev());
</script>
</body>
</html>
